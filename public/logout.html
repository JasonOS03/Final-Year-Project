<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href = "logout.css" rel = "stylesheet">
    <title>Logout</title>
</head>
<body>
    
    <nav class = "navbar bg-warning" role = "navigation">
        <div class = "container justify-content-between d-flex align-items-center">
        <h1 class = "navbar-brand mb-0">GenSaaS</h1>
        <ul class = "text-black text-center navbar-nav flex-row gap-3">

    <h1 class = "text-center mb-4">Logout</h1>
    <div class = "container">
        <div class = "row justify-content-center">
            <div id = "logout_form" class = "col-md-8 bg-success text-center rounded p-4" role = "region" aria-labelledby="confirm-logout">

                <p class = "text-center text-white mb-2">Would you like to logout? please click the below button to end your session </p>
                <button class = " btn btn-warning text-center text-black mb-2 col-md-4 rounded fw-semibold" id = "logout_button" aria-label = "end your session">Logout</button>
            </div>
        </div>
    </div>
    <br><br>
    <footer class = "text-center text-muted mt-5">Note: Upon logout, you will be redirected to the login page</footer>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenSaaS</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; object-src 'none';">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome (required for star rating theme) -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css" rel="stylesheet">

    <!-- Star Rating CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-star-rating/css/star-rating.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-star-rating/themes/krajee-fas/theme.min.css" rel="stylesheet">
</head>
<body>
    <nav class = "navbar bg-warning mb-2">
        <div class = "container ">
        <ul class = "bg-warning text-black text-center rounded navbar-nav flex-row gap-5 mx-auto p-3">
            <li class = "nav-item mr-2 ml-2 p-4"><a class = "nav-link" href = "profile.html">Profile</a></li>
            <li class = "nav-item mr-2 ml-2 p-4"><a class = "nav-link" href = "homepage.html">Recommendations</a></li>
            <li class = "nav-item mr-2 ml-2 p-4"><a class = "nav-link" href = "logout.html">Logout</a></li>
        </ul>
    </div>
</nav>

    <!--Homepage header-->
<h1 class = "text-center bg-success text-white p-2 rounded" aria-label = "app heading">Welcome to GenSaaS!</h1>
<br><br>
<h2 class = "text-center text-black p-2" aria-label = "Recommendations"> Latest Recommendations</h2>

<!--Search bar for filtering between recommendations by keyword-->
<div id =  "searchnav">
    <label class = "form-label" aria-label="Filter Recommendations">Filter</label>
    <input type = "search" placeholder = "Filter recommendation by keyword" class = "form-control" id = "filter">
</div>
<br><br>
<!--defines a container for holding the Server response-->
<div id = "carousel" class = "carousel slide" data-bs-ride = "carousel">

    <div class = "carousel-indicators"></div>

<button type ="button" class = "carousel-control-next" data-bs-slide="next" data-bs-target="#carousel" id = "right_arrow">
    <img src = "right-arrow.png" alt = "right arrow" width = "50" height="50" style = "vertical-align: middle;">
</button>

<button type = "button" class = "carousel-control-prev" data-bs-slide="prev" data-bs-target="#carousel" id = "left_arrow">
    <img src = "left-arrow.png" alt = "left arrow" width = "50" height = "50" style = "vertical-align: middle;">
</button>

<div class = "carousel-inner"></div>
</div>

<div class = "modal"></div>


<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<!-- Star Rating plugin -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap-star-rating/js/star-rating.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap-star-rating/themes/krajee-fas/theme.min.js"></script>

<style>
        .nav-item:hover
        {
            background-color: gold;
        }
</style>
<script src = "homepage.js"></script>
</body>
</html>

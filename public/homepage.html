<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffc107">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>GenSaaS</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; object-src 'none';">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/user_profile.png">
    <link rel="icon" type="image/png" href="/user_profile.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome (required for star rating theme) -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css" rel="stylesheet">

    <!-- Star Rating CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-star-rating/css/star-rating.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-star-rating/themes/krajee-fas/theme.min.css" rel="stylesheet">
    <link href = "homepage.css" rel = "stylesheet">
</head>
<body>
    <nav class = "navbar bg-warning" role = "navigation">
        <div class = "container justify-content-between d-flex align-items-center">
        <h1 class = "navbar-brand mb-0">GenSaaS</h1>
        <ul class = "text-black text-center navbar-nav flex-row gap-3">
            <li class = "nav-item"><a class = "nav-link" href = "profile.html">Profile</a></li>
            <li class = "nav-item"><a class = "nav-link" href = "homepage.html">Recommendations</a></li>
            <li class = "nav-item"><a class = "nav-link" href = "logout.html">Logout</a></li>
        </ul>
    </div>
</nav>

    <!--Homepage header-->
<div class = "container mt-4 text-center">
<h1 class = "text-center text-success page-title">Welcome to GenSaaS!</h1>
<h2 class = "text-center lead text-secondary mt-3"> Your Latest Recommendations</h2>
</div>

<!--Search bar for filtering between recommendations by keyword-->
<div id =  "searchnav">
    <label for = "filter" class = "form-label fw-semibold text-center" aria-label="Filter Recommendations">Filter</label>
    <input type = "search" id = "filter" placeholder = "Filter recommendations by keyword" class = "form-control" aria-label = "Filter recommendations by keyword">
</div>
<br><br>
<!--defines a container for holding the Server response-->
<div id = "carousel" class = "carousel slide" data-bs-ride = "carousel" aria-label="Recommendations carousel">

    <div class = "carousel-indicators"></div>

<button type ="button" class = "carousel-control-next" data-bs-slide="next" data-bs-target="#carousel" id = "right_arrow">
    <img src = "right-arrow.png" alt = "next recommendation" width = "50" height="50">
</button>

<button type = "button" class = "carousel-control-prev" data-bs-slide="prev" data-bs-target="#carousel" id = "left_arrow">
    <img src = "left-arrow.png" alt = "previous recommendation" width = "50" height = "50">
</button>

<div class = "carousel-inner"></div>
</div>

<div class = "modal"></div>


<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<!-- Star Rating plugin -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap-star-rating/js/star-rating.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap-star-rating/themes/krajee-fas/theme.min.js"></script>

<script src="runtime-config.js"></script>
<script src="api.js"></script>
<script src = "homepage.js"></script>
<script src="pwa.js"></script>
</body>
</html>
